# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow generates SLSA provenance for release artifacts.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to upload assets to"
        required: true
        type: string
  release:
    types: [created]

jobs:
  build:
    name: build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Install ObjectBox native library
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          pushd "$tmpdir"
          go mod init objectbox-install
          bash <(curl -s https://raw.githubusercontent.com/objectbox/objectbox-go/v1.9.0/install.sh)
          popd
          rm -rf "$tmpdir"

      - name: Install ObjectBox native library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tmpdir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $tmpdir | Out-Null
          Push-Location $tmpdir
          go mod init objectbox-install
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/objectbox/objectbox-go/v1.9.0/install.ps1" -OutFile "install.ps1"
          ./install.ps1
          Pop-Location
          Remove-Item -Recurse -Force $tmpdir

      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${RELEASE_TAG}"
          fi
          if [[ -z "${tag}" ]]; then
            echo "release tag is required" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build release artifact
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${VERSION#v}"
          name="repobridge_${VERSION}_${GOOS}_${GOARCH}"
          out_dir="dist/${name}"
          mkdir -p "${out_dir}"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${version}" \
            -o "${out_dir}/repobridge" \
            ./cmd/repobridge
          (cd dist && tar -czf "${name}.tar.gz" "${name}")
          rm -rf "${out_dir}"

      - name: Build release artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $version = $env:VERSION.TrimStart("v")
          $name = "repobridge_${env:VERSION}_${env:GOOS}_${env:GOARCH}"
          $outDir = Join-Path "dist" $name
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          go build `
            -trimpath `
            -ldflags="-s -w -X main.version=$version" `
            -o (Join-Path $outDir "repobridge.exe") `
            ./cmd/repobridge
          Compress-Archive -Path $outDir -DestinationPath (Join-Path "dist" "$name.zip") -Force
          Remove-Item -Recurse -Force $outDir

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${RELEASE_TAG}"
          fi
          if [[ -z "${tag}" ]]; then
            echo "release tag is required" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          echo "digests=$(cd dist && sha256sum *.tar.gz *.zip checksums.txt | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  provenance:
    needs: [publish]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.publish.outputs.digests }}"
      upload-tag-name: "${{ needs.publish.outputs.release-tag }}"
      upload-assets: true
