# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow generates SLSA provenance for release artifacts.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to upload assets to"
        required: true
        type: string
  release:
    types: [created]

jobs:
  build:
    name: build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            objectbox-config: linux-x64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            objectbox-config: linux-aarch64
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            objectbox-config: macos-universal
          - goos: darwin
            goarch: arm64
            runner: macos-14
            objectbox-config: macos-universal
          - goos: windows
            goarch: amd64
            runner: windows-latest
            objectbox-config: windows-x64
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.3"

      - name: Download ObjectBox native library
        if: runner.os != 'Windows'
        env:
          OBJECTBOX_CONFIG: ${{ matrix.objectbox-config }}
        run: |
          set -euo pipefail
          objectbox_dir="${RUNNER_TEMP}/objectbox"
          extract_dir="${objectbox_dir}/extract"
          mkdir -p "${objectbox_dir}/include" "${objectbox_dir}/lib" "${extract_dir}"
          pushd "${objectbox_dir}"
          if [[ "${OBJECTBOX_CONFIG}" == linux-* ]]; then
            archive_ext="tar.gz"
          else
            archive_ext="zip"
          fi
          archive="objectbox-${OBJECTBOX_CONFIG}.${archive_ext}"
          curl --location --fail --output "${archive}" "https://github.com/objectbox/objectbox-c/releases/download/v4.2.0/${archive}"
          if [[ "${archive_ext}" == "tar.gz" ]]; then
            tar -xzf "${archive}" -C "${extract_dir}"
          else
            unzip -q "${archive}" -d "${extract_dir}"
          fi
          cp "${extract_dir}"/include/* "${objectbox_dir}/include/"
          cp "${extract_dir}"/lib/* "${objectbox_dir}/lib/"
          echo "CGO_CFLAGS=-I${objectbox_dir}/include" >> "${GITHUB_ENV}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            echo "CGO_LDFLAGS=-L${objectbox_dir}/lib -Wl,-rpath,@executable_path" >> "${GITHUB_ENV}"
            echo "DYLD_LIBRARY_PATH=${objectbox_dir}/lib:${DYLD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
          else
            echo "CGO_LDFLAGS=-L${objectbox_dir}/lib -Wl,-rpath,\$ORIGIN" >> "${GITHUB_ENV}"
            echo "LD_LIBRARY_PATH=${objectbox_dir}/lib:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
          fi
          echo "OBJECTBOX_LIB_DIR=${objectbox_dir}/lib" >> "${GITHUB_ENV}"
          popd

      - name: Download ObjectBox native library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $objectboxDir = Join-Path $env:RUNNER_TEMP "objectbox"
          $archive = Join-Path $env:RUNNER_TEMP "objectbox-windows-x64.zip"
          New-Item -ItemType Directory -Path $objectboxDir -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/objectbox/objectbox-c/releases/download/v4.2.0/objectbox-windows-x64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $objectboxDir -Force
          "CGO_CFLAGS=-I$objectboxDir\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CGO_LDFLAGS=-L$objectboxDir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OBJECTBOX_LIB_DIR=$objectboxDir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$objectboxDir\lib;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${RELEASE_TAG}"
          fi
          if [[ -z "${tag}" ]]; then
            echo "release tag is required" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build release artifact
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${VERSION#v}"
          name="repobridge_${VERSION}_${GOOS}_${GOARCH}"
          out_dir="dist/${name}"
          mkdir -p "${out_dir}"
          cp "${OBJECTBOX_LIB_DIR}"/libobjectbox.* "${out_dir}/"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${version}" \
            -o "${out_dir}/repobridge" \
            ./cmd/repobridge
          (cd dist && tar -czf "${name}.tar.gz" "${name}")
          rm -rf "${out_dir}"

      - name: Build release artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $version = $env:VERSION.TrimStart("v")
          $name = "repobridge_${env:VERSION}_${env:GOOS}_${env:GOARCH}"
          $outDir = Join-Path "dist" $name
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Copy-Item (Join-Path $env:OBJECTBOX_LIB_DIR "objectbox.dll") $outDir
          go build `
            -trimpath `
            -ldflags="-s -w -X main.version=$version" `
            -o (Join-Path $outDir "repobridge.exe") `
            ./cmd/repobridge
          Compress-Archive -Path $outDir -DestinationPath (Join-Path "dist" "$name.zip") -Force
          Remove-Item -Recurse -Force $outDir

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${RELEASE_TAG}"
          fi
          if [[ -z "${tag}" ]]; then
            echo "release tag is required" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          echo "digests=$(cd dist && sha256sum *.tar.gz *.zip checksums.txt | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  provenance:
    needs: [publish]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.publish.outputs.digests }}"
      upload-tag-name: "${{ needs.publish.outputs.release-tag }}"
      upload-assets: true
