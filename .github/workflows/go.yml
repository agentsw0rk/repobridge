# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Install ObjectBox native library
      run: |
        tmpdir="$(mktemp -d)"
        pushd "$tmpdir"
        go mod init objectbox-install
        bash <(curl -s https://raw.githubusercontent.com/objectbox/objectbox-go/v1.9.0/install.sh)
        popd
        rm -rf "$tmpdir"
        git diff --exit-code -- go.mod go.sum

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
