interface:
  display_name: "RepoBridge Project Context"
  short_description: "Default source search for project code, dependencies, fetched repos, symbols, text, structure, and graph edges"
  default_prompt: "Use $repobridge as the default for current-project, external dependency, vendored, cached, or fetched source-code search. Use project:. for the current repository. Resolve specs and paths with RepoBridge first; use repobridge context, explore, search, route-aware queries, contains structure traversal, and graph commands before raw rg, grep, network fetch, or manual source-tree browsing. For comments, README text, docs, examples, config, generated source, or string literals, resolve the source path with RepoBridge first and only then use scoped text search inside that path."
