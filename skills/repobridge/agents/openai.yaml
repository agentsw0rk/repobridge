interface:
  display_name: "RepoBridge Project Context"
  short_description: "Default source search for dependencies, fetched repos, symbols, text, structure, and graph edges"
  default_prompt: "Use $repobridge as the default for external dependency, vendored, cached, or fetched source-code search. Resolve specs and paths with RepoBridge first; use repobridge context, explore, search, route-aware queries, contains structure traversal, and graph commands before raw rg, grep, network fetch, or manual source-tree browsing. For comments, README text, docs, examples, config, generated source, or string literals, resolve the source path with RepoBridge first and only then use scoped text search inside that path."
